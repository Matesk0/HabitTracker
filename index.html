<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #1c1c1e;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --dot-empty: rgba(255, 255, 255, 0.18);
      --border-radius: 24px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #18212e 0%, #0a0a0c 70%);
      min-height: 100vh;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Tabs */
    .tab-bar {
      display: flex;
      background: #1c1c1e;
      border-radius: 20px;
      padding: 3px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      padding: 7px 20px;
      border-radius: 17px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #000000;
    }

    /* Content */
    .content-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Pills */
    .pills-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pills-container {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pills-container::-webkit-scrollbar { display: none; }

    .pill-btn {
      padding: 7px 15px;
      border-radius: 18px;
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-add-small {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Card */
    .widget-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .widget-title-area .title-big {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .widget-title-area .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .widget-stat-right {
      text-align: right;
    }

    .widget-stat-right .stat-number {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .widget-stat-right .stat-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Widget 1 Button */
    .toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.25s;
    }

    .toggle-btn.done {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Widget 2: 30 Balls (No numbers) */
    .grid-30-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 14px 0;
    }

    .ball-30 {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--dot-empty);
      cursor: pointer;
      transition: all 0.2s;
    }

    .ball-30.done {
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .ball-30.today {
      border: 2px solid #0a84ff;
    }

    /* Widget 3: Year Dot Grid (Passed days solid white) */
    .year-grid-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(19, 9px);
      gap: 4px;
    }

    .year-ball {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--dot-empty);
    }

    .year-ball.passed {
      background: #ffffff;
    }

    .year-ball.today {
      background: #ffffff;
      transform: scale(1.3);
      box-shadow: 0 0 8px #ffffff;
    }

    .widget-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .delete-link {
      color: #ff453a;
      cursor: pointer;
    }

    .card-caption {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-content h3 { font-size: 17px; margin-bottom: 12px; }
    .modal-content input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-cancel {
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-save {
      padding: 8px 14px;
      border-radius: 10px;
      background: #fff;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-habits">Habits</button>
    <button class="tab-btn" id="tab-year">Year Progress</button>
  </div>

  <main class="content-container">

    <!-- TAB 1: HABITS -->
    <div id="section-habits" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="pills-row">
        <div class="pills-container" id="pills-container"></div>
        <button class="btn-add-small" id="btn-add">+</button>
      </div>

      <!-- Widget 1: Quick Check -->
      <section class="widget-card">
        <div class="widget-header">
          <div class="widget-title-area">
            <div class="title-big" id="w1-title">Reading</div>
            <div class="subtitle" id="w1-sub">Today's status</div>
          </div>
          <div class="widget-stat-right">
            <div class="stat-number" id="w1-streak">0</div>
            <div class="stat-label">streak</div>
          </div>
        </div>
        <button class="toggle-btn" id="w1-btn">○ Mark as Done</button>
      </section>

      <!-- Widget 2: 30 Days Balls Only -->
      <section class="widget-card">
        <div class="widget-header">
          <div class="widget-title-area">
            <div class="title-big" id="w2-title">Reading</div>
            <div class="subtitle" id="w2-sub">Last 30 Days • 0%</div>
          </div>
          <div class="widget-stat-right">
            <div class="stat-number" id="w2-stat">0</div>
            <div class="stat-label">of 30 done</div>
          </div>
        </div>

        <div class="grid-30-balls" id="w2-grid"></div>

        <div class="widget-footer">
          <span>Tap any ball to toggle</span>
          <span class="delete-link" id="w2-delete">Delete habit</span>
        </div>
      </section>
    </div>

    <!-- TAB 2: YEAR PROGRESS -->
    <div id="section-year" style="display: none; flex-direction: column; gap: 14px;">
      <!-- Small Year Card -->
      <section class="widget-card">
        <div class="widget-header">
          <div class="widget-title-area">
            <div class="title-big" id="w3-small-year">2026</div>
            <div class="subtitle" id="w3-small-sub">Day 18 of 365</div>
          </div>
          <div class="widget-stat-right">
            <div class="stat-number" id="w3-small-days">348</div>
            <div class="stat-label">days left</div>
          </div>
        </div>
        <div class="card-caption">Dale</div>
      </section>

      <!-- Full Year Matrix Card -->
      <section class="widget-card">
        <div class="widget-header">
          <div class="widget-title-area">
            <div class="title-big" id="w3-year">2026</div>
            <div class="subtitle" id="w3-sub">Day 18 • 4%</div>
          </div>
          <div class="widget-stat-right">
            <div class="stat-number" id="w3-days">348</div>
            <div class="stat-label">days left</div>
          </div>
        </div>

        <div class="year-grid-container">
          <div class="year-grid" id="year-grid"></div>
        </div>

        <div class="widget-footer">
          <span>Jan 1</span>
          <span style="color:#fff;font-weight:600" id="w3-today">Day 18</span>
          <span>Dec 31</span>
        </div>
        <div class="card-caption">Dale</div>
      </section>
    </div>

  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-content">
      <h3>New Habit</h3>
      <input type="text" id="input-new" placeholder="e.g. Reading, Gym, Coding" maxlength="24" />
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-save" id="btn-save">Add</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'habit_tracker_state_v3';
    const defaultState = {
      activeTab: 'habits',
      selectedHobbyId: 'reading',
      hobbies: [
        { id: 'reading', name: 'Reading', history: {} },
        { id: 'workout', name: 'Workout', history: {} },
        { id: 'coding', name: 'Coding', history: {} }
      ]
    };

    function loadState() {
      try {
        const d = localStorage.getItem(STORAGE_KEY);
        if (d) return JSON.parse(d);
      } catch (e) {}
      return defaultState;
    }

    function saveState(s) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    }

    let state = loadState();

    function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }
    function getDayOfYear(d) {
      const s = new Date(d.getFullYear(), 0, 0);
      const diff = d - s + ((s.getTimezoneOffset() - d.getTimezoneOffset()) * 60 * 1000);
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }
    function getKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getHobby() {
      return state.hobbies.find(h => h.id === state.selectedHobbyId) || state.hobbies[0];
    }

    function getStreak(hobby, todayKey) {
      if (!hobby || !hobby.history) return 0;
      let count = 0;
      const cur = new Date();
      cur.setHours(0,0,0,0);
      if (!hobby.history[todayKey]) cur.setDate(cur.getDate() - 1);
      while (true) {
        const k = getKey(cur);
        if (hobby.history[k]) { count++; cur.setDate(cur.getDate() - 1); }
        else break;
      }
      return count;
    }

    // Tabs
    const tabHabits = document.getElementById('tab-habits');
    const tabYear = document.getElementById('tab-year');
    const secHabits = document.getElementById('section-habits');
    const secYear = document.getElementById('section-year');

    function setTab(t) {
      state.activeTab = t;
      saveState(state);
      tabHabits.classList.toggle('active', t === 'habits');
      tabYear.classList.toggle('active', t === 'year');
      secHabits.style.display = t === 'habits' ? 'flex' : 'none';
      secYear.style.display = t === 'year' ? 'flex' : 'none';
    }

    tabHabits.onclick = () => setTab('habits');
    tabYear.onclick = () => setTab('year');

    function render() {
      setTab(state.activeTab || 'habits');

      const now = new Date();
      const yr = now.getFullYear();
      const totalDays = isLeap(yr) ? 366 : 365;
      const doy = getDayOfYear(now);
      const left = totalDays - doy;
      const pct = Math.round((doy / totalDays) * 100);
      const todayKey = getKey(now);

      // Pills
      const pillsCont = document.getElementById('pills-container');
      pillsCont.innerHTML = '';
      state.hobbies.forEach(h => {
        const b = document.createElement('button');
        b.className = `pill-btn ${h.id === state.selectedHobbyId ? 'active' : ''}`;
        b.textContent = h.name;
        b.onclick = () => {
          state.selectedHobbyId = h.id;
          saveState(state);
          render();
        };
        pillsCont.appendChild(b);
      });

      const hobby = getHobby();
      if (!hobby) return;

      const doneToday = !!hobby.history[todayKey];
      const streak = getStreak(hobby, todayKey);

      // Widget 1
      document.getElementById('w1-title').textContent = hobby.name;
      document.getElementById('w1-sub').textContent = doneToday ? 'Completed today' : 'Not done yet';
      document.getElementById('w1-streak').textContent = streak;
      const w1Btn = document.getElementById('w1-btn');
      w1Btn.className = `toggle-btn ${doneToday ? 'done' : ''}`;
      w1Btn.textContent = doneToday ? '✓ Done' : '○ Mark as Done';

      // Widget 2: 30 Balls Only
      document.getElementById('w2-title').textContent = hobby.name;
      const w2Grid = document.getElementById('w2-grid');
      w2Grid.innerHTML = '';
      let done30 = 0;

      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(now.getDate() - i);
        const k = getKey(d);
        const isDone = !!hobby.history[k];
        const isToday = i === 0;
        if (isDone) done30++;

        const ball = document.createElement('div');
        ball.className = `ball-30 ${isDone ? 'done' : ''} ${isToday ? 'today' : ''}`;
        ball.onclick = () => {
          hobby.history[k] = !hobby.history[k];
          if (!hobby.history[k]) delete hobby.history[k];
          saveState(state);
          render();
        };
        w2Grid.appendChild(ball);
      }

      document.getElementById('w2-stat').textContent = done30;
      document.getElementById('w2-sub').textContent = `Last 30 Days • ${Math.round((done30/30)*100)}%`;

      // Widget 3: Year
      document.getElementById('w3-small-year').textContent = yr;
      document.getElementById('w3-small-sub').textContent = `Day ${doy} of ${totalDays}`;
      document.getElementById('w3-small-days').textContent = left;

      document.getElementById('w3-year').textContent = yr;
      document.getElementById('w3-sub').textContent = `Day ${doy} • ${pct}%`;
      document.getElementById('w3-days').textContent = left;
      document.getElementById('w3-today').textContent = `Day ${doy}`;

      const yearGrid = document.getElementById('year-grid');
      yearGrid.innerHTML = '';
      for (let day = 1; day <= totalDays; day++) {
        const ball = document.createElement('div');
        ball.className = 'year-ball';
        if (day <= doy) ball.classList.add('passed'); // All passed days are WHITE
        if (day === doy) ball.classList.add('today');
        yearGrid.appendChild(ball);
      }
    }

    document.getElementById('w1-btn').onclick = () => {
      const h = getHobby();
      if (!h) return;
      const k = getKey(new Date());
      h.history[k] = !h.history[k];
      if (!h.history[k]) delete h.history[k];
      saveState(state);
      render();
    };

    const modal = document.getElementById('modal-backdrop');
    const inp = document.getElementById('input-new');
    document.getElementById('btn-add').onclick = () => {
      inp.value = '';
      modal.classList.add('open');
      setTimeout(() => inp.focus(), 50);
    };
    document.getElementById('btn-cancel').onclick = () => modal.classList.remove('open');
    document.getElementById('btn-save').onclick = () => {
      const val = inp.value.trim();
      if (!val) return;
      const id = val.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now().toString(36);
      state.hobbies.push({ id, name: val, history: {} });
      state.selectedHobbyId = id;
      saveState(state);
      modal.classList.remove('open');
      render();
    };

    document.getElementById('w2-delete').onclick = () => {
      if (state.hobbies.length <= 1) return alert('Keep at least 1 habit.');
      const h = getHobby();
      if (confirm(`Delete "${h.name}"?`)) {
        state.hobbies = state.hobbies.filter(x => x.id !== h.id);
        state.selectedHobbyId = state.hobbies[0].id;
        saveState(state);
        render();
      }
    };

    render();
  </script>
</body>
</html>
