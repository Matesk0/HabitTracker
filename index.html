<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit & Day Tracker</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1c1c1e;
      --card-bg-hover: #242426;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --dot-empty: rgba(255, 255, 255, 0.18);
      --dot-active: #ffffff;
      --accent: #0a84ff;
      --border-radius: 26px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1c2738 0%, #0c1017 60%, #050608 100%);
      min-height: 100vh;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pills-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .pills-container::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .pill-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    button {
      font-family: inherit;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    button.btn-primary {
      background: rgba(255, 255, 255, 0.12);
    }
    button.btn-primary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Widgets */
    .widgets-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .widget-title-area .title-big {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.1;
    }

    .widget-title-area .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .widget-stat-right {
      text-align: right;
    }

    .widget-stat-right .stat-number {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .widget-stat-right .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Widget 1 Button */
    .small-widget-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 14px 18px;
      margin: 8px 0;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .small-widget-button.done {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
    }

    .small-widget-button .btn-icon {
      font-size: 18px;
      font-weight: bold;
    }
    .small-widget-button .btn-text {
      font-size: 15px;
      font-weight: 700;
    }

    /* Mode toggle for Widget 2 */
    .mode-toggle {
      display: flex;
      align-self: center;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 12px;
      gap: 4px;
    }

    .mode-btn {
      padding: 4px 12px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    /* 30-Day Dot Grid (Image Dot Aesthetic) */
    .hobby-30-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      padding: 12px 0;
    }

    .hobby-dot-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 48px;
      cursor: pointer;
      user-select: none;
    }

    .hobby-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--dot-empty);
      margin-bottom: 4px;
      transition: all 0.2s ease;
    }

    .hobby-dot.done {
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    }

    .hobby-dot.today {
      border: 2px solid var(--accent);
    }

    .hobby-dot-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
    }
    .hobby-dot-label.today {
      color: var(--accent);
      font-weight: 700;
    }

    /* 19-Column Dot Grid (Replica of Image.png) */
    .year-grid-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(19, 10px);
      gap: 5px;
    }

    .year-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot-empty);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .year-dot.passed {
      background: rgba(255, 255, 255, 0.4);
    }

    .year-dot.done {
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .year-dot.today {
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 4px #ffffff;
      transform: scale(1.3);
      z-index: 2;
    }

    .widget-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .delete-link {
      color: #ff453a;
      cursor: pointer;
    }

    .widget-caption {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 14px;
      font-weight: 500;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 340px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-content h3 {
      font-size: 18px;
      margin-bottom: 14px;
    }

    .modal-content input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .tooltip {
      position: fixed;
      background: #000;
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.15s ease;
      z-index: 1000;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .tooltip.visible {
      opacity: 1;
      transform: translateY(-16px);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>Habit Tracker</h1>
      <p id="header-date">Loading date...</p>
    </div>
    <div class="controls">
      <button class="btn-primary" id="btn-add-hobby" title="Add new hobby">+ Add</button>
    </div>
  </header>

  <div class="pills-container" id="pills-container"></div>

  <main class="widgets-container">

    <!-- WIDGET 1: Small Card Quick Button -->
    <section class="widget-card">
      <div class="widget-header">
        <div class="widget-title-area">
          <div class="title-big" id="w1-name">Reading</div>
          <div class="subtitle" id="w1-day-sub">Day 18 of 365</div>
        </div>
        <div class="widget-stat-right">
          <div class="stat-number" id="w1-streak">0</div>
          <div class="stat-label">day streak</div>
        </div>
      </div>

      <div class="small-widget-button" id="w1-btn">
        <span class="btn-icon" id="w1-btn-icon">○</span>
        <span class="btn-text" id="w1-btn-text">Tap to mark done</span>
      </div>

      <div class="widget-caption">Dale</div>
    </section>

    <!-- WIDGET 2: Hobby Progress Dot Matrix (Like Year Progress in Image.png) -->
    <section class="widget-card">
      <div class="widget-header">
        <div class="widget-title-area">
          <div class="title-big" id="w2-name">Reading</div>
          <div class="subtitle" id="w2-sub">Last 30 Days • 0%</div>
        </div>
        <div class="widget-stat-right">
          <div class="stat-number" id="w2-stat">0</div>
          <div class="stat-label" id="w2-stat-label">of 30 done</div>
        </div>
      </div>

      <div class="mode-toggle">
        <button class="mode-btn active" id="btn-mode-30">30 Days</button>
        <button class="mode-btn" id="btn-mode-year">Full Year</button>
      </div>

      <div id="w2-container"></div>

      <div class="widget-footer">
        <span>Tap any dot to toggle</span>
        <span class="delete-link" id="w2-delete">Delete habit</span>
      </div>
      <div class="widget-caption">Dale</div>
    </section>

    <!-- WIDGET 3: Full Year Progress (Exact Image.png replica) -->
    <section class="widget-card">
      <div class="widget-header">
        <div class="widget-title-area">
          <div class="title-big" id="w3-year">2026</div>
          <div class="subtitle" id="w3-sub">Day 18 • 4%</div>
        </div>
        <div class="widget-stat-right">
          <div class="stat-number" id="w3-days-left">348</div>
          <div class="stat-label">days left</div>
        </div>
      </div>

      <div class="year-grid-container">
        <div class="year-grid" id="w3-grid"></div>
      </div>

      <div class="widget-footer">
        <span>Jan 1</span>
        <span style="color:#fff;font-weight:600" id="w3-today-label">Today</span>
        <span>Dec 31</span>
      </div>
      <div class="widget-caption">Dale</div>
    </section>

  </main>

  <!-- Add Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-content">
      <h3>New Habit / Hobby</h3>
      <input type="text" id="input-new-hobby" placeholder="e.g. Guitar, Gym, Reading" maxlength="24" />
      <div class="modal-actions">
        <button id="btn-modal-cancel">Cancel</button>
        <button class="btn-primary" id="btn-modal-save">Add</button>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const STORAGE_KEY = 'habit_tracker_state_v2';
    const defaultState = {
      selectedHobbyId: 'reading',
      hobbyViewMode: '30days',
      hobbies: [
        { id: 'reading', name: 'Reading', history: {} },
        { id: 'workout', name: 'Workout', history: {} },
        { id: 'coding', name: 'Coding', history: {} }
      ]
    };

    function loadState() {
      try {
        const d = localStorage.getItem(STORAGE_KEY);
        if (d) return JSON.parse(d);
      } catch (e) {}
      return defaultState;
    }

    function saveState(s) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    }

    let state = loadState();

    function isLeapYear(y) {
      return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
    }

    function getDayOfYear(d) {
      const s = new Date(d.getFullYear(), 0, 0);
      const diff = d - s + ((s.getTimezoneOffset() - d.getTimezoneOffset()) * 60 * 1000);
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function getDateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getSelectedHobby() {
      return state.hobbies.find(h => h.id === state.selectedHobbyId) || state.hobbies[0];
    }

    function calculateStreak(hobby, todayKey) {
      if (!hobby || !hobby.history) return 0;
      let count = 0;
      const cur = new Date();
      cur.setHours(0, 0, 0, 0);
      if (!hobby.history[todayKey]) cur.setDate(cur.getDate() - 1);

      while (true) {
        const k = getDateKey(cur);
        if (hobby.history[k]) {
          count++;
          cur.setDate(cur.getDate() - 1);
        } else break;
      }
      return count;
    }

    // Elements
    const pillsContainer = document.getElementById('pills-container');
    const headerDate = document.getElementById('header-date');
    const w1Name = document.getElementById('w1-name');
    const w1DaySub = document.getElementById('w1-day-sub');
    const w1Streak = document.getElementById('w1-streak');
    const w1Btn = document.getElementById('w1-btn');
    const w1BtnIcon = document.getElementById('w1-btn-icon');
    const w1BtnText = document.getElementById('w1-btn-text');

    const w2Name = document.getElementById('w2-name');
    const w2Sub = document.getElementById('w2-sub');
    const w2Stat = document.getElementById('w2-stat');
    const w2StatLabel = document.getElementById('w2-stat-label');
    const w2Container = document.getElementById('w2-container');
    const btnMode30 = document.getElementById('btn-mode-30');
    const btnModeYear = document.getElementById('btn-mode-year');
    const w2Delete = document.getElementById('w2-delete');

    const w3Year = document.getElementById('w3-year');
    const w3Sub = document.getElementById('w3-sub');
    const w3DaysLeft = document.getElementById('w3-days-left');
    const w3Grid = document.getElementById('w3-grid');
    const w3TodayLabel = document.getElementById('w3-today-label');

    const tooltip = document.getElementById('tooltip');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const inputNewHobby = document.getElementById('input-new-hobby');

    function showTooltip(e, text) {
      tooltip.textContent = text;
      tooltip.classList.add('visible');
      const r = e.target.getBoundingClientRect();
      tooltip.style.left = `${r.left + r.width / 2 - tooltip.offsetWidth / 2}px`;
      tooltip.style.top = `${r.top - 8}px`;
    }
    function hideTooltip() { tooltip.classList.remove('visible'); }

    function render() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const totalDays = isLeapYear(currentYear) ? 366 : 365;
      const dayOfYear = getDayOfYear(now);
      const daysLeft = totalDays - dayOfYear;
      const yearPct = Math.round((dayOfYear / totalDays) * 100);
      const todayKey = getDateKey(now);

      headerDate.textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

      // Pills
      pillsContainer.innerHTML = '';
      state.hobbies.forEach(h => {
        const b = document.createElement('button');
        b.className = `pill-btn ${h.id === state.selectedHobbyId ? 'active' : ''}`;
        b.textContent = h.name;
        b.onclick = () => {
          state.selectedHobbyId = h.id;
          saveState(state);
          render();
        };
        pillsContainer.appendChild(b);
      });

      const hobby = getSelectedHobby();
      if (!hobby) return;

      const isTodayDone = !!hobby.history[todayKey];
      const streak = calculateStreak(hobby, todayKey);

      // Widget 1
      w1Name.textContent = hobby.name;
      w1DaySub.textContent = `Day ${dayOfYear} of ${totalDays}`;
      w1Streak.textContent = streak;
      if (isTodayDone) {
        w1Btn.classList.add('done');
        w1BtnIcon.textContent = '✓';
        w1BtnText.textContent = 'Completed today';
      } else {
        w1Btn.classList.remove('done');
        w1BtnIcon.textContent = '○';
        w1BtnText.textContent = 'Tap to mark done';
      }

      // Widget 2
      w2Name.textContent = hobby.name;
      btnMode30.classList.toggle('active', state.hobbyViewMode === '30days');
      btnModeYear.classList.toggle('active', state.hobbyViewMode === 'year');

      w2Container.innerHTML = '';
      if (state.hobbyViewMode === '30days') {
        let done30 = 0;
        const grid = document.createElement('div');
        grid.className = 'hobby-30-grid';

        for (let i = 29; i >= 0; i--) {
          const d = new Date();
          d.setDate(now.getDate() - i);
          const k = getDateKey(d);
          const done = !!hobby.history[k];
          const isCur = i === 0;
          if (done) done30++;

          const item = document.createElement('div');
          item.className = 'hobby-dot-item';

          const dot = document.createElement('div');
          dot.className = `hobby-dot ${done ? 'done' : ''} ${isCur ? 'today' : ''}`;

          const lbl = document.createElement('div');
          lbl.className = `hobby-dot-label ${isCur ? 'today' : ''}`;
          lbl.textContent = d.getDate();

          item.appendChild(dot);
          item.appendChild(lbl);

          const tipText = `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}: ${done ? 'Completed' : 'Not done'}`;
          item.onmouseenter = (e) => showTooltip(e, tipText);
          item.onmouseleave = hideTooltip;

          item.onclick = () => {
            hobby.history[k] = !hobby.history[k];
            if (!hobby.history[k]) delete hobby.history[k];
            saveState(state);
            render();
          };

          grid.appendChild(item);
        }
        w2Container.appendChild(grid);

        const pct30 = Math.round((done30 / 30) * 100);
        w2Sub.textContent = `Last 30 Days • ${pct30}%`;
        w2Stat.textContent = done30;
        w2StatLabel.textContent = 'of 30 done';
      } else {
        // Full Year Dot Matrix View for Hobby
        let yearDone = 0;
        const cont = document.createElement('div');
        cont.className = 'year-grid-container';
        const grid = document.createElement('div');
        grid.className = 'year-grid';

        for (let day = 1; day <= totalDays; day++) {
          const d = new Date(currentYear, 0, day);
          const k = getDateKey(d);
          const done = !!hobby.history[k];
          const isPast = day < dayOfYear;
          const isCur = day === dayOfYear;
          if (done) yearDone++;

          const dot = document.createElement('div');
          dot.className = `year-dot ${isPast ? 'passed' : ''} ${done ? 'done' : ''} ${isCur ? 'today' : ''}`;

          const tipText = `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}: ${done ? 'Completed' : 'Not done'}`;
          dot.onmouseenter = (e) => showTooltip(e, tipText);
          dot.onmouseleave = hideTooltip;

          dot.onclick = () => {
            hobby.history[k] = !hobby.history[k];
            if (!hobby.history[k]) delete hobby.history[k];
            saveState(state);
            render();
          };

          grid.appendChild(dot);
        }
        cont.appendChild(grid);
        w2Container.appendChild(cont);

        const yearPctHabit = dayOfYear > 0 ? Math.round((yearDone / dayOfYear) * 100) : 0;
        w2Sub.textContent = `Year ${currentYear} • ${yearPctHabit}%`;
        w2Stat.textContent = yearDone;
        w2StatLabel.textContent = 'days done';
      }

      // Widget 3
      w3Year.textContent = currentYear;
      w3Sub.textContent = `Day ${dayOfYear} • ${yearPct}%`;
      w3DaysLeft.textContent = daysLeft;
      w3TodayLabel.textContent = `Today (Day ${dayOfYear})`;

      w3Grid.innerHTML = '';
      for (let day = 1; day <= totalDays; day++) {
        const dot = document.createElement('div');
        dot.className = 'year-dot';
        if (day < dayOfYear) dot.classList.add('passed');
        else if (day === dayOfYear) dot.classList.add('today');

        const d = new Date(currentYear, 0, day);
        dot.onmouseenter = (e) => showTooltip(e, `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} (Day ${day})`);
        dot.onmouseleave = hideTooltip;

        w3Grid.appendChild(dot);
      }
    }

    // Listeners
    w1Btn.onclick = () => {
      const hobby = getSelectedHobby();
      if (!hobby) return;
      const k = getDateKey(new Date());
      hobby.history[k] = !hobby.history[k];
      if (!hobby.history[k]) delete hobby.history[k];
      saveState(state);
      render();
    };

    btnMode30.onclick = () => {
      state.hobbyViewMode = '30days';
      saveState(state);
      render();
    };

    btnModeYear.onclick = () => {
      state.hobbyViewMode = 'year';
      saveState(state);
      render();
    };

    document.getElementById('btn-add-hobby').onclick = () => {
      inputNewHobby.value = '';
      modalBackdrop.classList.add('open');
      setTimeout(() => inputNewHobby.focus(), 50);
    };

    document.getElementById('btn-modal-cancel').onclick = () => modalBackdrop.classList.remove('open');
    document.getElementById('btn-modal-save').onclick = () => {
      const name = inputNewHobby.value.trim();
      if (!name) return;
      const id = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now().toString(36);
      state.hobbies.push({ id, name, history: {} });
      state.selectedHobbyId = id;
      saveState(state);
      modalBackdrop.classList.remove('open');
      render();
    };

    w2Delete.onclick = () => {
      if (state.hobbies.length <= 1) {
        alert('You must have at least one habit.');
        return;
      }
      const hobby = getSelectedHobby();
      if (confirm(`Delete "${hobby.name}"?`)) {
        state.hobbies = state.hobbies.filter(h => h.id !== hobby.id);
        state.selectedHobbyId = state.hobbies[0].id;
        saveState(state);
        render();
      }
    };

    render();
  </script>
</body>
</html>
