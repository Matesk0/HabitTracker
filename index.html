<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #1c1c1e;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --dot-empty: rgba(255, 255, 255, 0.18);
      --border-radius: 24px;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #18212e 0%, #0a0a0c 70%);
      min-height: 100vh;
      font-family: var(--font-family);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Tabs */
    .tab-bar {
      display: flex;
      background: #1c1c1e;
      border-radius: 20px;
      padding: 3px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      padding: 7px 20px;
      border-radius: 17px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #000000;
    }

    /* Content */
    .content-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Pills */
    .pills-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pills-container {
      flex: 1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pills-container::-webkit-scrollbar { display: none; }

    .pill-btn {
      padding: 7px 15px;
      border-radius: 18px;
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-add-small {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Card */
    .widget-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .widget-title-area .title-big {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .widget-badge {
      padding: 3px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
    }

    .widget-badge.active {
      background: rgba(10, 132, 255, 0.18);
      border-color: #0a84ff;
      color: #5ac8fa;
    }

    .streak-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .widget-stat-right {
      text-align: right;
    }

    .widget-stat-right .stat-number {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
    }

    .widget-stat-right .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Button */
    .toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.25s;
      margin-bottom: 12px;
    }

    .toggle-btn.done {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* 30 Balls */
    .grid-30-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 8px 0;
    }

    .ball-30 {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--dot-empty);
      cursor: pointer;
      transition: all 0.2s;
    }

    .ball-30.done {
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .ball-30.today {
      border: 2px solid #0a84ff;
    }

    /* Year Dot Grid */
    .year-grid-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(19, 10px);
      gap: 4px;
    }

    .year-ball {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot-empty);
    }

    .year-ball.passed {
      background: #ffffff;
    }

    .year-ball.today {
      background: #ffffff;
      transform: scale(1.3);
      box-shadow: 0 0 8px #ffffff;
    }

    .widget-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .delete-link {
      color: #ff453a;
      cursor: pointer;
      font-weight: 500;
    }

    /* Bottom Floating Action / QR Code trigger */
    .qr-banner {
      position: fixed;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      z-index: 50;
    }

    /* Unified Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 22px;
      width: 90%;
      max-width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      text-align: left;
    }

    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.4; }
    .modal-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 11px 14px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .modal-btn {
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .modal-btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .modal-btn-save {
      background: #ffffff;
      color: #000000;
      font-weight: 700;
    }
    .modal-btn-delete {
      background: #ff453a;
      color: #ffffff;
      font-weight: 700;
    }
    .qr-img {
      width: 200px;
      height: 200px;
      margin: 12px auto;
      display: block;
      border-radius: 12px;
      background: #ffffff;
      padding: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-habits">Habits</button>
    <button class="tab-btn" id="tab-year">Year Progress</button>
  </div>

  <main class="content-container">

    <!-- TAB 1: HABITS -->
    <div id="section-habits" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="pills-row">
        <div class="pills-container" id="pills-container"></div>
        <button class="btn-add-small" id="btn-add">+</button>
      </div>

      <!-- Container for all habit cards rendered simultaneously -->
      <div id="habits-list" style="display: flex; flex-direction: column; gap: 14px;"></div>
    </div>

    <!-- TAB 2: YEAR PROGRESS (Minimalist Dot Matrix) -->
    <div id="section-year" style="display: none; flex-direction: column; gap: 14px;">
      <section class="widget-card">
        <div class="widget-header">
          <div class="widget-title-area">
            <div class="title-big" id="w3-date">Sep 29</div>
            <div class="subtitle" id="w3-year">2026</div>
          </div>
          <div class="widget-stat-right">
            <div class="stat-number" id="w3-pct">75%</div>
            <div class="stat-label" id="w3-doy">Day 272/365</div>
          </div>
        </div>

        <div class="year-grid-container">
          <div class="year-grid" id="year-grid"></div>
        </div>

        <div class="widget-footer">
          <span>Jan 1</span>
          <span style="color:#fff;font-weight:600" id="w3-today">Day 272</span>
          <span>Dec 31</span>
        </div>
      </section>
    </div>

  </main>

  <!-- Floating Mobile QR Button -->
  <div class="qr-banner" id="btn-qr">
    <span>📲 Mobile Install QR</span>
  </div>

  <!-- QR Code Modal -->
  <div class="modal-backdrop" id="modal-qr">
    <div class="modal-box" style="text-align: center;">
      <div class="modal-title">Install on Mobile</div>
      <div class="modal-desc">Scan with your phone camera to open and install to home screen.</div>
      <img
        class="qr-img"
        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fmatesk0.github.io%2FHabitTracker%2F"
        alt="QR Code"
      />
      <div class="modal-actions" style="justify-content: center; margin-top: 12px;">
        <button class="modal-btn modal-btn-save" id="btn-close-qr">Done</button>
      </div>
    </div>
  </div>

  <!-- Add Modal -->
  <div class="modal-backdrop" id="modal-add">
    <div class="modal-box">
      <div class="modal-title">New Habit</div>
      <input class="modal-input" type="text" id="input-new" placeholder="e.g. Reading, Gym, Coding" maxlength="24" />
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="btn-cancel-add">Cancel</button>
        <button class="modal-btn modal-btn-save" id="btn-save-add">Add</button>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-backdrop" id="modal-delete">
    <div class="modal-box">
      <div class="modal-title">Delete Habit</div>
      <div class="modal-desc" id="delete-desc">Are you sure you want to delete this habit?</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="btn-cancel-delete">Cancel</button>
        <button class="modal-btn modal-btn-delete" id="btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- Notice Modal -->
  <div class="modal-backdrop" id="modal-notice">
    <div class="modal-box">
      <div class="modal-title">Notice</div>
      <div class="modal-desc" id="notice-desc">You must keep at least one habit.</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-save" id="btn-close-notice">Got it</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'habit_tracker_state_v3';
    const defaultState = {
      activeTab: 'habits',
      selectedHobbyId: 'reading',
      viewFilter: 'all',
      hobbies: [
        { id: 'reading', name: 'Reading', history: {} },
        { id: 'workout', name: 'Workout', history: {} },
        { id: 'coding', name: 'Coding', history: {} }
      ]
    };

    function loadState() {
      try {
        const d = localStorage.getItem(STORAGE_KEY);
        if (d) return JSON.parse(d);
      } catch (e) {}
      return defaultState;
    }

    function saveState(s) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    }

    let state = loadState();
    let deleteTargetId = null;

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }
    function getDayOfYear(d) {
      const s = new Date(d.getFullYear(), 0, 0);
      const diff = d - s + ((s.getTimezoneOffset() - d.getTimezoneOffset()) * 60 * 1000);
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }
    function getKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function formatDate(d) {
      return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
    }

    function getStreak(hobby, todayKey) {
      if (!hobby || !hobby.history) return 0;
      let count = 0;
      const cur = new Date();
      cur.setHours(0,0,0,0);
      if (!hobby.history[todayKey]) cur.setDate(cur.getDate() - 1);
      while (true) {
        const k = getKey(cur);
        if (hobby.history[k]) { count++; cur.setDate(cur.getDate() - 1); }
        else break;
      }
      return count;
    }

    // Tabs
    const tabHabits = document.getElementById('tab-habits');
    const tabYear = document.getElementById('tab-year');
    const secHabits = document.getElementById('section-habits');
    const secYear = document.getElementById('section-year');

    function setTab(t) {
      state.activeTab = t;
      saveState(state);
      tabHabits.classList.toggle('active', t === 'habits');
      tabYear.classList.toggle('active', t === 'year');
      secHabits.style.display = t === 'habits' ? 'flex' : 'none';
      secYear.style.display = t === 'year' ? 'flex' : 'none';
    }

    tabHabits.onclick = () => setTab('habits');
    tabYear.onclick = () => setTab('year');

    function render() {
      setTab(state.activeTab || 'habits');

      const now = new Date();
      const yr = now.getFullYear();
      const totalDays = isLeap(yr) ? 366 : 365;
      const doy = getDayOfYear(now);
      const pct = Math.round((doy / totalDays) * 100);
      const todayKey = getKey(now);

      // Pills: "All" + each habit
      const pillsCont = document.getElementById('pills-container');
      pillsCont.innerHTML = '';

      const allPill = document.createElement('button');
      allPill.className = `pill-btn ${(!state.viewFilter || state.viewFilter === 'all') ? 'active' : ''}`;
      allPill.textContent = `All (${state.hobbies.length})`;
      allPill.onclick = () => {
        state.viewFilter = 'all';
        saveState(state);
        render();
      };
      pillsCont.appendChild(allPill);

      state.hobbies.forEach(h => {
        const b = document.createElement('button');
        b.className = `pill-btn ${state.viewFilter === h.id ? 'active' : ''}`;
        b.textContent = h.name;
        b.onclick = () => {
          state.viewFilter = h.id;
          saveState(state);
          render();
        };
        pillsCont.appendChild(b);
      });

      // Render Habits (all or filtered)
      const habitsList = document.getElementById('habits-list');
      habitsList.innerHTML = '';

      const filtered = (!state.viewFilter || state.viewFilter === 'all')
        ? state.hobbies
        : state.hobbies.filter(h => h.id === state.viewFilter);

      filtered.forEach(hobby => {
        const doneToday = !!hobby.history[todayKey];
        const streak = getStreak(hobby, todayKey);
        const isWidgetActive = (state.selectedHobbyId === hobby.id);

        let done30 = 0;
        const past30 = [];
        for (let i = 29; i >= 0; i--) {
          const d = new Date();
          d.setDate(now.getDate() - i);
          const k = getKey(d);
          const isDone = !!hobby.history[k];
          if (isDone) done30++;
          past30.push({ key: k, isDone, isToday: i === 0 });
        }
        const pct30 = Math.round((done30 / 30) * 100);

        const card = document.createElement('section');
        card.className = 'widget-card';

        card.innerHTML = `
          <div class="widget-header">
            <div class="widget-title-area">
              <div class="title-big">${hobby.name}</div>
              <div class="badge-row">
                <button class="widget-badge ${isWidgetActive ? 'active' : ''}" data-widget-id="${hobby.id}">
                  ${isWidgetActive ? '● Active Widget' : '○ Set for Widget'}
                </button>
                <span class="streak-label">${streak}d streak</span>
              </div>
            </div>
            <div class="widget-stat-right">
              <div class="stat-number">${pct30}%</div>
              <div class="stat-label">${done30}/30 done</div>
            </div>
          </div>

          <button class="toggle-btn ${doneToday ? 'done' : ''}" data-toggle-today="${hobby.id}">
            ${doneToday ? '✓ Completed Today' : '○ Mark as Done'}
          </button>

          <div class="grid-30-balls" id="grid-${hobby.id}"></div>

          <div class="widget-footer">
            <span>Tap any ball to toggle</span>
            ${state.hobbies.length > 1 ? `<span class="delete-link" data-delete-id="${hobby.id}">Delete</span>` : ''}
          </div>
        `;

        habitsList.appendChild(card);

        // Bind widget badge toggle
        card.querySelector(`[data-widget-id="${hobby.id}"]`).onclick = () => {
          state.selectedHobbyId = hobby.id;
          saveState(state);
          render();
        };

        // Bind today toggle
        card.querySelector(`[data-toggle-today="${hobby.id}"]`).onclick = () => {
          hobby.history[todayKey] = !hobby.history[todayKey];
          if (!hobby.history[todayKey]) delete hobby.history[todayKey];
          saveState(state);
          render();
        };

        // Bind 30 balls
        const grid = card.querySelector(`#grid-${hobby.id}`);
        past30.forEach(dot => {
          const ball = document.createElement('div');
          ball.className = `ball-30 ${dot.isDone ? 'done' : ''} ${dot.isToday ? 'today' : ''}`;
          ball.onclick = () => {
            hobby.history[dot.key] = !hobby.history[dot.key];
            if (!hobby.history[dot.key]) delete hobby.history[dot.key];
            saveState(state);
            render();
          };
          grid.appendChild(ball);
        });

        // Bind delete
        const delBtn = card.querySelector(`[data-delete-id="${hobby.id}"]`);
        if (delBtn) {
          delBtn.onclick = () => {
            deleteTargetId = hobby.id;
            document.getElementById('delete-desc').textContent = `Are you sure you want to delete "${hobby.name}"?`;
            modalDelete.classList.add('open');
          };
        }
      });

      // TAB 2: Year Progress
      document.getElementById('w3-date').textContent = formatDate(now);
      document.getElementById('w3-year').textContent = yr;
      document.getElementById('w3-pct').textContent = `${pct}%`;
      document.getElementById('w3-doy').textContent = `Day ${doy}/${totalDays}`;
      document.getElementById('w3-today').textContent = `Day ${doy}`;

      const yearGrid = document.getElementById('year-grid');
      yearGrid.innerHTML = '';
      for (let day = 1; day <= totalDays; day++) {
        const ball = document.createElement('div');
        ball.className = 'year-ball';
        if (day <= doy) ball.classList.add('passed');
        if (day === doy) ball.classList.add('today');
        yearGrid.appendChild(ball);
      }
    }

    // Modals
    const modalAdd = document.getElementById('modal-add');
    const modalDelete = document.getElementById('modal-delete');
    const modalNotice = document.getElementById('modal-notice');
    const modalQr = document.getElementById('modal-qr');
    const inp = document.getElementById('input-new');

    document.getElementById('btn-qr').onclick = () => modalQr.classList.add('open');
    document.getElementById('btn-close-qr').onclick = () => modalQr.classList.remove('open');

    document.getElementById('btn-add').onclick = () => {
      inp.value = '';
      modalAdd.classList.add('open');
      setTimeout(() => inp.focus(), 50);
    };
    document.getElementById('btn-cancel-add').onclick = () => modalAdd.classList.remove('open');
    document.getElementById('btn-save-add').onclick = () => {
      const val = inp.value.trim();
      if (!val) return;
      const id = val.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now().toString(36);
      state.hobbies.push({ id, name: val, history: {} });
      state.selectedHobbyId = id;
      state.viewFilter = 'all';
      saveState(state);
      modalAdd.classList.remove('open');
      render();
    };

    document.getElementById('btn-cancel-delete').onclick = () => {
      deleteTargetId = null;
      modalDelete.classList.remove('open');
    };

    document.getElementById('btn-confirm-delete').onclick = () => {
      if (!deleteTargetId) return;
      state.hobbies = state.hobbies.filter(x => x.id !== deleteTargetId);
      if (state.selectedHobbyId === deleteTargetId) {
        state.selectedHobbyId = state.hobbies[0].id;
      }
      if (state.viewFilter === deleteTargetId) {
        state.viewFilter = 'all';
      }
      saveState(state);
      deleteTargetId = null;
      modalDelete.classList.remove('open');
      render();
    };

    document.getElementById('btn-close-notice').onclick = () => modalNotice.classList.remove('open');

    render();

    // Register Service Worker for PWA install & auto-update
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
